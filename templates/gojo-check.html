<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gojo Check — BAN SITE</title>

<style>
:root{
    --gojo-blue:#4d7cff;
    --gojo-violet:#8b5cff;
    --gojo-cyan:#62d9ff;
    --gojo-dark:#03030b;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 15% 15%,rgba(77,124,255,.28),transparent 32%),
        radial-gradient(circle at 85% 85%,rgba(139,92,255,.24),transparent 34%),
        radial-gradient(circle at 50% 50%,rgba(98,217,255,.05),transparent 45%),
        var(--gojo-dark);
}

.check-box{
    width:100%;
    max-width:500px;
    padding:24px;
    border:1px solid rgba(98,217,255,.28);
    border-radius:20px;
    background:linear-gradient(145deg,rgba(10,10,30,.94),rgba(4,4,15,.96));
    box-shadow:
        0 0 45px rgba(77,124,255,.16),
        0 0 90px rgba(139,92,255,.08),
        inset 0 0 35px rgba(98,217,255,.035);
}

.check-title{
    margin:0 0 18px;
    text-align:center;
    font-size:25px;
    letter-spacing:3px;
    text-shadow:
        0 0 10px rgba(98,217,255,.65),
        0 0 24px rgba(139,92,255,.35);
}

.check-input{
    width:100%;
    padding:14px;
    border:1px solid rgba(100,130,255,.35);
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,.035);
    color:#fff;
    box-shadow:inset 0 0 18px rgba(77,124,255,.035);
    font-size:15px;
}

.check-button{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:800;
    color:#fff;
    background:linear-gradient(90deg,var(--gojo-blue),var(--gojo-violet),#5b8cff);
    box-shadow:
        0 0 18px rgba(77,124,255,.25),
        0 0 32px rgba(139,92,255,.12);
}

#result{
    margin-top:20px;
    white-space:pre-wrap;
    line-height:1.55;
    font-size:14px;
}

</style>
</head>

<body>

<div class="check-box">

    <h1 class="check-title">𓆙 GOJO CHECK</h1>

    <input
        id="checkNumber"
        class="check-input"
        type="text"
        placeholder="+224XXXXXXXXX"
        autocomplete="off"
    >

    <button
        class="check-button"
        type="button"
        onclick="runCheck()">
        VÉRIFIER
    </button>

    <div id="result"></div>

</div>

<script>
