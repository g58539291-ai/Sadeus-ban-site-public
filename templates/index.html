<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadeus</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#090000;
    color:#fff;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    overflow:hidden;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.page::before{
    content:"";
    position:absolute;
    width:150vw;
    height:150vw;
    border-radius:50%;
    background:
        radial-gradient(circle,
        rgba(120,0,0,.32) 0%,
        rgba(60,0,0,.22) 35%,
        transparent 70%);
    animation:aura 7s ease-in-out infinite alternate;
}

@keyframes aura{
    from{transform:scale(.95);}
    to{transform:scale(1.08);}
}

.hero{
    position:relative;
    z-index:2;
    width:100%;
    max-width:520px;
    min-height:100vh;
    padding:35px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.serpent-globe{
    width: min(82vw, 430px);
    height: auto;
    display: block;
    position: absolute;
    top: 0px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
}

/* GLOBE */

.globe-wrap{
    position:relative;
    width:255px;
    height:255px;
    margin-bottom:28px;
}

.globe{
    position:absolute;
    inset:12px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 28%,
            #8f1b1b 0%,
            #5c0b0b 28%,
            #260303 58%,
            #070000 100%);
    border:1px solid rgba(255,80,80,.65);
    box-shadow:
        0 0 25px rgba(170,0,0,.85),
        0 0 55px rgba(100,0,0,.45),
        inset -25px -20px 40px rgba(0,0,0,.92),
        inset 12px 10px 30px rgba(255,40,40,.22);
    overflow:hidden;
}

.globe-map{
    position:absolute;
    inset:-7%;
    background-image:
        linear-gradient(
            rgba(100,0,0,.38),
            rgba(100,0,0,.38)
        ),
        url("/static/world-map.svg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    opacity:.82;
    filter:
        brightness(.72)
        sepia(1)
        saturate(5)
        hue-rotate(315deg)
        contrast(1.35);
    transform:scale(1.12);
}

.globe::before,
.globe::after{
    content:"";
    position:absolute;
    z-index:3;
    border:1px solid rgba(255,100,100,.18);
    border-radius:50%;
    pointer-events:none;
}

.globe::before{
    width:170%;
    height:55%;
    left:-35%;
    top:23%;
}

.globe::after{
    width:55%;
    height:170%;
    left:23%;
    top:-35%;
}

/* lignes du globe */
.globe::before,
.globe::after{
    content:"";
    position:absolute;
    border:1px solid rgba(255,80,80,.16);
    border-radius:50%;
}

.globe::before{
    width:170%;
    height:55%;
    left:-35%;
    top:23%;
}

.globe::after{
    width:55%;
    height:170%;
    left:23%;
    top:-35%;
}

/* continents stylisés */
.land{
    position:absolute;
    opacity:.28;
    filter:blur(.3px);
}

.land.one{
    width:85px;
    height:48px;
    background:#8d2020;
    border-radius:55% 30% 60% 35%;
    top:55px;
    left:48px;
    transform:rotate(-18deg);
}

.land.two{
    width:70px;
    height:95px;
    background:#721313;
    border-radius:35% 60% 40% 55%;
    top:105px;
    right:45px;
    transform:rotate(25deg);
}

.land.three{
    width:50px;
    height:38px;
    background:#9b2424;
    border-radius:50%;
    bottom:40px;
    left:80px;
}

/* serpent */
.snake{
    position:absolute;
    z-index:5;
    top:17px;
    left:12px;
    width:235px;
    font-size:108px;
    line-height:1;
    transform:rotate(-16deg);
    text-shadow:
        0 0 7px #ff2020,
        0 0 18px rgba(150,0,0,.9),
        0 0 35px rgba(255,0,0,.35);
    pointer-events:none;
}

.crown{
    font-size:28px;
    margin-bottom:8px;
    text-shadow:0 0 12px rgba(255,50,50,.55);
}

h1{
    font-size:43px;
    letter-spacing:7px;
    margin-bottom:14px;
    text-shadow:
        0 0 10px rgba(255,0,0,.75),
        0 0 28px rgba(130,0,0,.6);
}

.motto{
    font-family:Georgia,"Times New Roman",serif;
    font-size:21px;
    margin-bottom:32px;
}

.main-button{
    display:inline-block;
    padding:15px 27px;
    border:1px solid rgba(255,100,100,.42);
    border-radius:10px;
    color:#fff;
    text-decoration:none;
    background:linear-gradient(
        135deg,
        rgba(110,0,0,.75),
        rgba(35,0,0,.9)
    );
    box-shadow:
        0 0 18px rgba(160,0,0,.35),
        inset 0 0 12px rgba(255,0,0,.08);
}

.bottom-motto{
    margin-top:27px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px;
    opacity:.92;
}

@media(max-width:380px){
    .globe-wrap{
        width:220px;
        height:220px;
    }

    .snake{
        width:205px;
        font-size:92px;
    }

    h1{
        font-size:37px;
    }

    .motto{
        font-size:18px;
    }
}

/* =========================
   PAGE 2 — SIGNALEMENT
   ========================= */

#reportPage{
    display:none;
    min-height:100vh;
    position:relative;
    overflow-y:auto;
    background:
        radial-gradient(circle at 15% 20%,rgba(130,0,0,.25),transparent 30%),
        radial-gradient(circle at 85% 75%,rgba(50,0,0,.30),transparent 35%),
        #090000;
}

.report-container{
    position:relative;
    z-index:2;
    width:min(92%,520px);
    min-height:100vh;
    margin:auto;
    padding:25px 20px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

/* Chaîne Sadeus */
.channel-link{
    color:#fff;
    text-decoration:none;
    font-size:15px;
    margin-bottom:24px;
    text-shadow:0 0 10px rgba(180,0,0,.45);
}

/* Header */
.report-header{
    width:100%;
    padding:18px 12px;
    border:1px solid rgba(255,70,70,.28);
    border-radius:12px;
    background:rgba(30,0,0,.55);
    box-shadow:
        0 0 20px rgba(130,0,0,.20),
        inset 0 0 15px rgba(255,0,0,.04);
    margin-bottom:18px;
}

.report-header-top{
    font-size:18px;
    letter-spacing:2px;
}

.report-header-main{
    margin-top:5px;
    font-size:24px;
    letter-spacing:3px;
}

/* Sadeus Sound */
.sound-button{
    padding:11px 22px;
    margin-bottom:22px;
    border:1px solid rgba(255,80,80,.32);
    border-radius:10px;
    color:#fff;
    background:rgba(80,0,0,.65);
    font-family:inherit;
    cursor:pointer;
}
.sound-player{
    position:relative;
    display:inline-block;
    margin-bottom:22px;
}

.song-menu{
    display:none;
    position:absolute;
    z-index:1000;
    left:50%;
    transform:translateX(-50%);
    top:calc(100% + 8px);
    width:min(310px,90vw);
    max-height:340px;
    overflow-y:auto;
    padding:10px;
    border:1px solid rgba(120,70,255,.45);
    border-radius:14px;
    background:rgba(10,0,20,.96);
    box-shadow:0 0 25px rgba(120,0,255,.18);
}

.song-menu.open{
    display:block;
}

.song-title{
    text-align:center;
    color:#fff;
    font-weight:700;
    padding:8px 4px 12px;
}

.song-option{
    display:block;
    width:100%;
    margin:5px 0;
    padding:9px 10px;
    border:1px solid rgba(255,80,80,.22);
    border-radius:9px;
    background:rgba(40,0,40,.8);
    color:#fff;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
}

.song-option:hover,
.song-option.active{
    background:rgba(110,0,90,.75);
    border-color:rgba(120,80,255,.6);
}

.song-controls{
    display:flex;
    justify-content:center;
    gap:8px;
    padding-top:10px;
}

.song-controls button{
    width:42px;
    height:36px;
    border:1px solid rgba(255,80,80,.3);
    border-radius:8px;
    color:#fff;
    background:rgba(80,0,0,.7);
    cursor:pointer;
}

/* Messenger / Business */
.account-buttons{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:22px;
}

.account-button{
    padding:14px 10px;
    border:1px solid rgba(255,255,255,.20);
    border-radius:10px;
    color:#fff;
    background:rgba(35,0,0,.65);
    font-family:inherit;
    cursor:pointer;
}

.account-button.active{
    background:linear-gradient(
        135deg,
        rgba(150,0,0,.72),
        rgba(60,0,0,.82)
    );
    border-color:rgba(255,80,80,.45);
}

/* Numéro */
.number-label{
    width:100%;
    text-align:left;
    font-size:15px;
    margin-bottom:8px;
}

.number-input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid rgba(255,80,80,.25);
    background:rgba(0,0,0,.45);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    outline:none;
    margin-bottom:22px;
}

.number-input::placeholder{
    color:rgba(255,255,255,.48);
}

/* Injecter le venin */
.venom-button{
    width:100%;
    padding:16px;
    border:1px solid rgba(255,70,70,.42);
    border-radius:11px;
    color:#fff;
    background:linear-gradient(
        135deg,
        rgba(145,0,0,.85),
        rgba(55,0,0,.95)
    );
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(150,0,0,.25);
}

.report-quote{
    margin-top:28px;
    font-size:16px;
    line-height:1.5;
    opacity:.9;
}

.powered{
    margin-top:auto;
    padding-top:45px;
    font-size:14px;
    opacity:.65;
}

@media(max-width:380px){
    .report-container{
        padding-left:15px;
        padding-right:15px;
    }
}



}

.giant-snake{
    transform-origin:center;
}


@keyframes snakeCrawl{
    0%{
        transform:translate(-5px,65px) rotate(-20deg);
    }
    20%{
        transform:translate(25px,25px) rotate(18deg);
    }
    40%{
        transform:translate(75px,65px) rotate(-12deg);
    }
    60%{
        transform:translate(115px,105px) rotate(20deg);
    }
    80%{
        transform:translate(55px,145px) rotate(-18deg);
    }
    100%{
        transform:translate(-5px,65px) rotate(-20deg);
    }
}

.giant-snake{
    position:absolute;
    z-index:6;
    width:360px;
    height:360px;
    left:50%;
    top:50%;
    margin-left:-180px;
    margin-top:-180px;

    font-size:185px;
    line-height:1;

    display:flex;
    align-items:center;
    justify-content:center;

    transform-origin:center;

    filter:
        saturate(1.7)
        contrast(1.15)
        drop-shadow(0 4px 7px rgba(0,0,0,.95))
        drop-shadow(0 0 18px rgba(160,0,0,.65));

    animation:giantSnakeAround 52s ease-in-out infinite;
    pointer-events:none;
}

@keyframes giantSnakeAround{

    0%{
        transform:
            translate(-65px,-25px)
            rotate(-35deg)
            scale(1.15);
    }

    12%{
        transform:
            translate(55px,-70px)
            rotate(15deg)
            scale(1.18);
    }

    25%{
        transform:
            translate(105px,0)
            rotate(70deg)
            scale(1.2);
    }

    38%{
        transform:
            translate(65px,75px)
            rotate(125deg)
            scale(1.18);
    }

    50%{
        transform:
            translate(-15px,105px)
            rotate(175deg)
            scale(1.2);
    }

    63%{
        transform:
            translate(-100px,55px)
            rotate(225deg)
            scale(1.18);
    }

    76%{
        transform:
            translate(-110px,-45px)
            rotate(275deg)
            scale(1.2);
    }

    89%{
        transform:
            translate(-45px,-100px)
            rotate(325deg)
            scale(1.18);
    }

    100%{
        transform:
            translate(-65px,-25px)
            rotate(345deg)
            scale(1.15);
    }
}

@media(max-width:380px){
    .giant-snake{
        width:310px;
        height:310px;
        margin-left:-155px;
        margin-top:-155px;
        font-size:155px;
    }
}

.back-report-button{
    display:block !important;
    position:relative;
    z-index:9999;
    width:max-content;

}
</style>

<!-- =========================
     PAGE 2 — SIGNALEMENT
     ========================= -->

<div id="reportPage">

    <main class="report-container">
<button
    type="button"
    onclick="backToHome()"
    style="display:block !important; position:relative; z-index:999999; margin:0 auto 20px; padding:10px 18px; border:1px solid rgba(180,70,255,.5); border-radius:10px; background:rgba(40,0,60,.95); color:#fff; font-family:Georgia,serif; font-weight:bold; cursor:pointer;">

</button>

        <a href="#" class="channel-link">
            Suivre la chaîne 📽️𝑪𝑶𝑼𝑳𝑶𝑰𝑹 𝑺𝑨𝑫𝑬𝑼𝑺ⁱⁿ
        </a>

        <div class="report-header">
            <div class="report-header-top">
                𝑺𝑨𝑫𝑬𝑼𝑺 𝑺𝒀𝑺𝑻𝑬𝑴
            </div>
            <div class="report-header-main">
                𝑪𝑬𝑵𝑻𝑹𝑬 𝑫𝑬 𝑺𝑰𝑮𝑵𝑨𝑳𝑬𝑴𝑬𝑵𝑻
            </div>
        </div>

            𓆙 𝐒𝐎𝐍𝐆
</button>
<div class="sound-player">

    <button type="button" class="sound-button" id="soundButton">
        𓆙 𝐒𝐎𝐍𝐆
    </button>

    <div class="song-menu" id="songMenu">
        <div class="song-title">𓆙 SADEUS MUSIC</div>

               <button class="song-option" data-track="0">GOJO RAP — INFINI DOMINANT</button>
        <button class="song-option" data-track="1">INFINI DIVIN</button>
        <button class="song-option" data-track="2">Satoru Gojo — Bug du Système</button>

            <button type="button" id="nextSong">⏭</button>
        </div>

<audio id="sadeusSong" preload="auto"></audio>

            <button
                type="button"
                class="account-button active"
                data-account="messenger">
                Messenger
            </button>

                type="button"
                class="account-button"
                data-account="business">
                Business

        </label>

            id="targetNumber"
            class="number-input"
            type="tel"
            placeholder="Entrez le numéro à signaler"
            autocomplete="off">

        <button
            type="button"
            class="venom-button"
            onclick="goToSupports()">
            𝑰𝑵𝑱𝑬𝑪𝑻𝑬𝑹 𝑳𝑬 𝑽𝑬𝑵𝑰𝑵

<script>
function showReport(){
    document.querySelector(".page").style.display = "none";
    document.getElementById("reportPage").style.display = "block";
    window.scrollTo(0,0);
}

function goToSupports(){
    const number = document.getElementById("targetNumber").value.trim();

    if(!number){
        alert("Veuillez entrer le numéro à signaler.");
        return;
    }

    localStorage.setItem("sadeus_target_number", number);

    document.querySelector(".page").style.display = "none";
    document.getElementById("reportPage").style.display = "none";

    const supportsPage = document.getElementById("supportsPage");

    if(supportsPage){
        supportsPage.style.display = "block";
        window.scrollTo(0,0);
    }
}

document.querySelectorAll(".account-button").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".account-button")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");
    });
});

const soundButton = document.getElementById("soundButton");
const songMenu = document.getElementById("songMenu");
const sadeusSong = document.getElementById("sadeusSong");
const songOptions = document.querySelectorAll(".song-option");
const prevSong = document.getElementById("prevSong");
const pauseSong = document.getElementById("pauseSong");
const nextSong = document.getElementById("nextSong");

const gojoTracks = [
    {title:"GOJO RAP — INFINI DOMINANT", src:"/static/audio/gojo/infini-dominant.m4a"},
    {title:"INFINI DIVIN", src:"/static/audio/gojo/infini-divin.m4a"},
    {title:"Satoru Gojo — Bug du Système", src:"/static/audio/gojo/bug-du-systeme.m4a"},
    {title:"GOJO INFINI — Chaque Combat est Déjà Fini", src:"/static/audio/gojo/gojo-combat.m4a"}
];

let currentTrack = 4;

function loadTrack(index, autoplay = false){
    currentTrack = (index + gojoTracks.length) % gojoTracks.length;

    sadeusSong.src = gojoTracks[currentTrack].src;

    songOptions.forEach((button, i) => {
        button.classList.toggle("active", i === currentTrack);
    });

    if(autoplay){
        sadeusSong.play().then(() => {
            soundButton.textContent = "𓆙 𝐒𝐎𝐍𝐆 ⏸";
        }).catch(() => {});
    }
}

soundButton.addEventListener("click", () => {
    songMenu.classList.toggle("open");
});

songOptions.forEach((button, index) => {
    button.addEventListener("click", (event) => {
        event.stopPropagation();
        loadTrack(index, true);
    });
});

pauseSong.addEventListener("click", (event) => {
    event.stopPropagation();

    if(sadeusSong.paused){
        sadeusSong.play().then(() => {
            soundButton.textContent = "𓆙 𝐒𝐎𝐍𝐆 ⏸";
        }).catch(() => {});
    }else{
        sadeusSong.pause();
        soundButton.textContent = "𓆙 𝐒𝐎𝐍𝐆 ▶";
    }
});

prevSong.addEventListener("click", (event) => {
    event.stopPropagation();
    loadTrack(currentTrack - 1, true);
});

nextSong.addEventListener("click", (event) => {
    event.stopPropagation();
    loadTrack(currentTrack + 1, true);
});

sadeusSong.addEventListener("ended", () => {
    loadTrack(currentTrack + 1, true);
});

document.addEventListener("click", (event) => {
    if(!event.target.closest(".sound-player")){
        songMenu.classList.remove("open");
    }
});

loadTrack(currentTrack, false);
</script>

<script>
window.addEventListener("message", function(event){
    if(event.data && event.data.action === "backToReport"){
        const supportsPage = document.getElementById("supportsPage");
        const reportPage = document.getElementById("reportPage");

        if(supportsPage) supportsPage.style.display = "none";
        if(reportPage) reportPage.style.display = "block";

        window.scrollTo(0,0);
    }
});
</script>
<script>
function backToHome(){
    document.getElementById("reportPage").style.display = "none";
    document.querySelector(".page").style.display = "block";
    window.scrollTo(0,0);
}
</script>
</body>
</html>
