    const container = document.getElementById("supports");
    container.innerHTML = "";

    supports.forEach((item,index)=>{
        const support = document.createElement("div");
        support.className = "support";

        const emailText = supportAddresses[accountType].join(" • ");

        support.innerHTML = `
            <button class="support-title"
                onclick="openSupport(${index})">
                Support ${index + 1}
            </button>

            <div class="support-content">
                <div class="email">${emailText}</div>

                <div class="languages">
                    ${languages.map(lang=>`
                        <button class="language"
                            onclick="chooseLanguage(this,'${lang[1]}',${index})">
                            ${lang[0]}
                        </button>
                    `).join("")}
                </div>

                <button class="inject"
                    onclick="openGmail(${index})">
                    Injection du venin
                </button>
            </div>
        `;

        container.appendChild(support);
    });
}

function openSupport(index){
    const all = document.querySelectorAll(".support");

    all.forEach((item,i)=>{
        if(i !== index){
            item.classList.remove("open");
            item.classList.remove("ready");
        }
    });

    all[index].classList.toggle("open");
}

function chooseLanguage(button,language,index){
    const support = document.querySelectorAll(".support")[index];

    support.querySelectorAll(".language")
        .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");
    support.dataset.language = language;
    support.classList.add("ready");
}

function openGmail(index) {
    const account = accountType;
    const language = selectedLanguage[index] || "fr";
    const target = localStorage.getItem("sadeus_target_number") || "";

    const recipients = supportAddresses[account].join(",");

    const subjects = {
        fr: "Signalement concernant un compte WhatsApp",
        en: "Report regarding a WhatsApp account",
        ar: "بلاغ يتعلق بحساب على واتساب",
        es: "Reporte relacionado con una cuenta de WhatsApp",
        pt: "Denúncia relacionada com uma conta WhatsApp"
    };

    let body = supports[index][language] || supports[index].fr;
    body = body.replace(/\+509XXXXXXXX/g, target);

    const subject = subjects[language] || subjects.fr;

    const gmailIntent =
        "intent:#Intent;" +
        "action=android.intent.action.SENDTO;" +
        "scheme=mailto;" +
        "to=" + encodeURIComponent(recipients) + ";" +
        "subject=" + encodeURIComponent(subject) + ";" +
        "body=" + encodeURIComponent(body) + ";" +
        "package=com.google.android.gm;" +
        "end";

    window.location.href = gmailIntent;
}

selectAccount("Messenger");
</script>
